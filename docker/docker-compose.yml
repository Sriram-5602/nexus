services:

  # ─── DATA STORES ─────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16        # postgres 16 + pgvector extension for AI embeddings
    container_name: nexus-postgres       # fixed name so other services can reference it
    restart: unless-stopped              # auto-restart on crash, stop only if manually stopped
    mem_limit: 300m                      # hard cap — container can't use more than 300MB RAM
    ports:
      - "5432:5432"                      # hostPort:containerPort — exposes db to your machine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}                          # db name, defaults to 'nexus'
      POSTGRES_USER: ${POSTGRES_USER:-nexus}                      # db user, defaults to 'nexus'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}  # required — crashes if missing
    volumes:
      - postgres_data:/var/lib/postgresql/data                    # persist db data across restarts
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # runs once on first start to create schema
    command: >
      postgres
        -c shared_buffers=128MB          # memory for caching data pages
        -c max_connections=100           # max simultaneous db connections
        -c work_mem=4MB                  # memory per sort/hash operation
        -c effective_cache_size=256MB    # hint to query planner about available cache
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]  # checks if db is accepting connections
      interval: 10s                      # check every 10 seconds
      timeout: 5s                        # fail if no response within 5s
      retries: 5                         # mark unhealthy after 5 consecutive failures

  redis:
    image: redis:7-alpine                # redis 7, alpine = minimal linux, small image size
    container_name: nexus-redis
    restart: unless-stopped
    mem_limit: 80m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data                 # persist cache to disk so it survives restarts
    command: >
      redis-server
        --maxmemory 64mb                 # redis memory cap — separate from container mem_limit
        --maxmemory-policy allkeys-lru   # when full, evict least recently used keys
        --appendonly yes                 # write operations to disk for persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # redis responds 'PONG' if healthy
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest            # self-hosted S3-compatible file storage
    container_name: nexus-minio
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "9000:9000"                      # S3 API port — your app talks to this
      - "9001:9001"                      # web admin console — open in browser to manage buckets
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data                 # persist uploaded files
    command: server /data --console-address ":9001"  # serve files from /data, admin on 9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest               # minio command line client — used just for setup
    container_name: nexus-minio-init
    mem_limit: 64m
    depends_on:
      minio:
        condition: service_healthy       # wait until minio is fully ready before running
    entrypoint: >
      /bin/sh -c "
        mc alias set nexus http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};  # connect to minio
        mc mb --ignore-existing nexus/documents;  # create bucket, skip if already exists
        mc mb --ignore-existing nexus/photos;
        mc mb --ignore-existing nexus/backups;
        echo 'Buckets created successfully';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # no restart policy — this container runs once, creates buckets, then exits

  # ─── AI ENGINE ───────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest          # runs AI language models locally
    container_name: nexus-ollama
    restart: unless-stopped
    mem_limit: 2g                        # AI models are large — needs more RAM than other services
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 2m             # keep model loaded in memory for 2 min after last request
      OLLAMA_HOST: 0.0.0.0             # listen on all interfaces so other containers can reach it
    volumes:
      - ollama_data:/root/.ollama       # persist downloaded AI models — they're large, don't re-download
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── APPLICATION SERVICES ────────────────────────────────────

  nexus-api:
    build:
      context: ../backend               # build from your backend source code
      dockerfile: Dockerfile            # using this Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    mem_limit: 600m                     # JVM needs more memory than other services
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: -Xmx512m -Xms256m    # JVM heap: max 512MB, start at 256MB
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexus}  # 'postgres' = container name, Docker resolves it
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis    # 'redis' = container name, Docker resolves it
      SPRING_DATA_REDIS_PORT: 6379
      NEXUS_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-nexus}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      CORTEX_BASE_URL: http://cortex-service:8000  # talks to cortex-service by container name
    depends_on:
      postgres:
        condition: service_healthy      # don't start until postgres is ready
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]  # Spring Boot health endpoint
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s               # give JVM 30s to start before healthchecks begin

  cortex-service:
    build:
      context: ../cortex-service       # your Python AI service
      dockerfile: Dockerfile
    container_name: nexus-cortex
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434   # talks to ollama by container name
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      REDIS_URL: redis://redis:6379
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/cortex/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  thread-service:
    build:
      context: ../thread-service        # your Node.js service
      dockerfile: Dockerfile
    container_name: nexus-thread
    restart: unless-stopped
    mem_limit: 180m
    ports:
      - "3000:3000"
    environment:
      NODE_OPTIONS: --max-old-space-size=128  # cap Node.js heap at 128MB
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── MONITORING & AUTOMATION ─────────────────────────────────

  grafana:
    image: grafana/grafana-oss:latest   # open source monitoring dashboards
    container_name: nexus-grafana
    restart: unless-stopped
    mem_limit: 250m
    ports:
      - "3001:3000"                     # grafana runs on 3000 internally, exposed on 3001 to avoid conflict
    environment:
      GF_SERVER_ROOT_URL: /grafana/                  # grafana is served at the /grafana/ path via nginx
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"          # required when serving from a sub-path
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana                             # persist dashboards and settings
      - ./grafana/provisioning:/etc/grafana/provisioning:ro      # pre-configured dashboards loaded on start

  n8n:
    image: n8nio/n8n:latest             # self-hosted workflow automation (like Zapier)
    container_name: nexus-n8n
    restart: unless-stopped
    mem_limit: 300m
    profiles:
      - full                            # only starts with: docker compose --profile full up
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: https://${DOMAIN:-nexus.yourname.dev}/n8n/    # public URL for incoming webhooks
      N8N_PATH: /n8n/                  # served at /n8n/ path via nginx
      DB_TYPE: postgresdb              # use your existing postgres instead of sqlite
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexus}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexus}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n       # persist workflows
    depends_on:
      postgres:
        condition: service_healthy

  # ─── NETWORKING & ACCESS ─────────────────────────────────────

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest  # VPN server — secure remote access to your stack
    container_name: nexus-wireguard
    restart: unless-stopped
    mem_limit: 100m
    cap_add:
      - NET_ADMIN                       # required: permission to manage network interfaces
      - SYS_MODULE                      # required: permission to load kernel modules
    ports:
      - "51820:51820/udp"              # WireGuard uses UDP, not TCP
    environment:
      PUID: 1000                        # run as user ID 1000 (non-root)
      PGID: 1000                        # run as group ID 1000
      TZ: ${TZ:-Asia/Kolkata}          # timezone, defaults to IST
      SERVERURL: ${DOMAIN:-nexus.yourname.dev}    # your public domain that VPN clients connect to
      PEERS: admin-phone,admin-laptop   # generates VPN config files for these two devices
      INTERNAL_SUBNET: 10.66.66.0      # private IP range for VPN clients
      PEERDNS: auto                     # automatically configure DNS for VPN clients
    volumes:
      - wireguard_config:/config        # persist VPN keys and peer configs
      - /lib/modules:/lib/modules:ro   # gives container read access to host kernel modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1  # kernel setting required for WireGuard routing

  nginx:
    image: nginx:alpine                 # reverse proxy — the single entry point for all traffic
    container_name: nexus-nginx
    restart: unless-stopped
    mem_limit: 50m
    ports:
      - "80:80"                         # HTTP
      - "443:443"                       # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro       # your nginx routing rules
      - ../frontend/dist:/usr/share/nginx/html:ro         # your built React app (npm run build output)
    depends_on:
      - nexus-api
      - thread-service
      - grafana

  cloudflared:
    image: cloudflare/cloudflared:latest  # Cloudflare tunnel — exposes stack to internet without opening router ports
    container_name: nexus-cloudflared
    restart: unless-stopped
    mem_limit: 100m
    command: tunnel run                   # starts the tunnel
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}  # tunnel auth token from Cloudflare dashboard

# ─── VOLUMES ───────────────────────────────────────────────────
# Named volumes managed by Docker — data persists even if containers are removed
# Stored in /var/lib/docker/volumes/ on your host machine

volumes:
  postgres_data:      # database files
  redis_data:         # redis persistence
  minio_data:         # uploaded files (documents, photos, backups)
  ollama_data:        # downloaded AI models
  grafana_data:       # dashboards and grafana settings
  n8n_data:           # automation workflows
  wireguard_config:   # VPN keys and peer configurations