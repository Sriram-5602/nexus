worker_processes auto;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ─── Upstream backends ──────────────────────────────────────

    upstream nexus_api {
        server nexus-api:8080;
    }

    upstream thread_service {
        server thread-service:3000;
    }

    upstream cortex_service {
        server cortex-service:8000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream n8n {
        server n8n:5678;
    }

    # ─── HOME-only IP ranges ───────────────────────────────────
    # Used by geo block below to restrict Vault, Console, Grafana, n8n

    geo $is_home {
        default         0;
        192.168.0.0/16  1;    # WiFi LAN
        10.66.66.0/24   1;    # WireGuard VPN
        127.0.0.0/8     1;    # Localhost
        172.16.0.0/12   1;    # Docker internal
    }

    server {
        listen 80;
        server_name _;

        # ─── Thread (Node.js chat) — must be BEFORE /api/ ──────

        location /api/v1/chat/ {
            proxy_pass http://thread_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/chat/ {
            proxy_pass http://thread_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ─── Cortex (Python AI engine) ─────────────────────────

        location /cortex/ {
            proxy_pass http://cortex_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ─── Spring Boot API ───────────────────────────────────

        location /api/ {
            proxy_pass http://nexus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ─── Actuator (Spring Boot health, HOME only) ──────────

        location /actuator/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://nexus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Grafana (HOME only) ───────────────────────────────

        location /grafana/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /grafana/api/live/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ─── n8n (HOME only) ───────────────────────────────────

        location /n8n/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://n8n;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Frontend (React SPA) ──────────────────────────────

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
