# =============================================================================
# NEXUS — Nginx Reverse Proxy Configuration
# Location: docker/nginx/nginx.conf
#
# WHAT IS THIS FILE?
# Nginx is the "front door" of Nexus. Every request from every browser first
# arrives here. Nginx reads the URL path and decides which backend service
# should handle it. The backends (Spring Boot, Node.js, Python) are never
# directly exposed — they only ever talk to Nginx, not the open internet.
#
# THINK OF IT LIKE: A hotel concierge. Guests (browsers) arrive at one place.
# The concierge reads their request ("I need room service") and routes them
# to the right department (kitchen). Guests never walk directly to the kitchen.
# =============================================================================


# ─── Worker Processes ──────────────────────────────────────────────────────
# "auto" = Nginx detects how many CPU cores exist and creates one worker per core.
# On your i5-6200U (2 cores / 4 threads), this will spawn ~4 workers.
# More workers = more requests can be handled in parallel.
worker_processes auto;


events {
    # How many simultaneous connections each worker can handle.
    # 256 is intentionally low — your server has limited RAM (8GB).
    # 4 workers × 256 connections = 1024 total max connections.
    worker_connections 256;
}


http {
    # Tells Nginx what Content-Type header to send for each file extension.
    # Without this, all files would be served as "application/octet-stream"
    # (binary blob), and browsers wouldn't know how to render CSS or JS.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;  # fallback if extension is unknown

    # Performance: uses OS-level file transfer instead of read→write.
    # Skips the CPU when sending static files (HTML, JS, CSS, images).
    sendfile    on;
    tcp_nopush  on;  # batches TCP packets for efficiency when sendfile is on

    # How long Nginx keeps an idle connection open waiting for more requests.
    # 65 seconds is the standard default.
    keepalive_timeout 65;

    # Maximum size of request body Nginx will accept.
    # Set to 50MB to allow uploading files in DocSense, Gallery, etc.
    # Without this, file uploads larger than 1MB (default) would be rejected.
    client_max_body_size 50m;

    # Compress text-based responses before sending them to the browser.
    # Reduces bandwidth usage — important for slow home upload connections.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;


    # =========================================================================
    # UPSTREAM BACKENDS
    # =========================================================================
    # An "upstream" is just a named address for a backend service.
    # Instead of writing "proxy_pass http://nexus-api:8080" everywhere,
    # we define it once here and reuse the name "nexus_api".
    #
    # HOW DOCKER DNS WORKS: In docker-compose, services talk to each other
    # by service name. "nexus-api" is the service name in docker-compose.yml.
    # Docker's internal DNS resolves "nexus-api" → the container's IP automatically.
    # You never need to know the actual IP address.
    # =========================================================================

    upstream nexus_api {
        server nexus-api:8080;   # Spring Boot API (Java) — 8 core modules
    }

    upstream thread_service {
        server thread-service:3000;  # Chat service (Node.js + Socket.io)
    }

    upstream cortex_service {
        server cortex-service:8000;  # AI engine (Python FastAPI)
    }

    upstream grafana {
        server grafana:3000;  # Monitoring dashboard (home-only)
    }

    upstream n8n {
        server n8n:5678;  # Automation workflows — disabled by default to save RAM
    }


    # =========================================================================
    # HOME-ONLY IP RANGE CHECK
    # =========================================================================
    # This "geo" block checks the client's IP address and sets a variable.
    # $is_home = 1 means the request came from a trusted network.
    # $is_home = 0 means it came from somewhere else (the open internet).
    #
    # WHY THIS EXISTS: Vault (secrets) and Console (monitoring) must NEVER be
    # accessible from a café, hotel, or random internet connection.
    # Even if someone knows your Cloudflare domain, they can't reach these.
    #
    # HOW WireGuard fits in: When you connect your phone via WireGuard VPN,
    # your phone gets an IP in the 10.66.66.0/24 range. From Nginx's
    # perspective, that's the same as being on home WiFi. ✓
    # =========================================================================
    geo $is_home {
        default         0;       # Anyone not listed below is NOT home
        192.168.0.0/16  1;       # Home WiFi LAN (router subnet)
        10.66.66.0/24   1;       # WireGuard VPN clients
        127.0.0.0/8     1;       # Localhost (requests from within the server itself)
        172.16.0.0/12   1;       # Docker's internal network (container-to-container)
    }


    # =========================================================================
    # SERVER BLOCK — The main routing logic
    # =========================================================================
    # There's only one "server" block here because Nexus runs on a single
    # domain. All traffic enters on port 80 (HTTP).
    # In production you'd add port 443 (HTTPS), but Cloudflare Tunnel handles
    # SSL termination for public traffic, so plain HTTP is fine internally.
    # =========================================================================
    server {
        listen 80;
        server_name _;  # "_" means "match any domain name" — catches everything


        # =====================================================================
        # LOCATION BLOCKS — URL PATH ROUTING
        # =====================================================================
        # Nginx reads these from TOP TO BOTTOM and uses the MOST SPECIFIC match.
        # CRITICAL ORDER: /api/v1/chat/ MUST come before /api/
        # If /api/ was first, chat requests would incorrectly go to Spring Boot.
        # =====================================================================


        # ─── Thread Service (Node.js chat) ───────────────────────────────────
        # Chat REST API calls: creating rooms, fetching message history, etc.
        # Example: GET /api/v1/chat/rooms → Thread service
        #
        # WHY BEFORE /api/?: Because /api/v1/chat/ is more specific than /api/.
        # Nginx always picks the longest matching prefix. If /api/ came first,
        # Nginx would send chat requests to Spring Boot — wrong service.
        location /api/v1/chat/ {
            proxy_pass http://thread_service;
            proxy_set_header Host $host;                            # Tell backend the original hostname
            proxy_set_header X-Real-IP $remote_addr;               # Client's actual IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Full IP chain
            proxy_set_header X-Forwarded-Proto $scheme;            # Was it HTTP or HTTPS?
        }

        # WebSocket connection for real-time chat (Socket.io).
        # WHAT IS A WEBSOCKET? Normal HTTP: browser asks → server answers → connection closes.
        # WebSocket: browser connects → connection STAYS OPEN → server can push messages anytime.
        # This is how chat messages appear instantly without refreshing the page.
        #
        # The "Upgrade" headers tell Nginx: "don't act as a proxy for this,
        # just pass raw bytes through — this is a long-lived socket, not an HTTP request."
        location /ws/chat/ {
            proxy_pass http://thread_service;
            proxy_http_version 1.1;                      # WebSocket requires HTTP/1.1
            proxy_set_header Upgrade $http_upgrade;      # Signal: "upgrade this to WebSocket"
            proxy_set_header Connection "upgrade";       # Keep the connection open
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;  # 24 hours — don't close idle chat connections
        }


        # ─── Cortex (Python FastAPI AI engine) ───────────────────────────────
        # All AI feature requests go here: document analysis, smart search,
        # MedPulse insights, etc.
        # Example: POST /cortex/analyze → Cortex service
        #
        # proxy_read_timeout 300s = 5 minutes. AI inference can be slow,
        # especially for large documents. Without this, Nginx would close
        # the connection after the default 60s and the user would see an error.
        location /cortex/ {
            proxy_pass http://cortex_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;  # AI tasks can take up to 5 minutes
        }


        # ─── Spring Boot API (all other /api/ traffic) ────────────────────────
        # Everything that isn't /api/v1/chat/ goes to the main Java backend.
        # This covers: auth, users, spaces, documents, finance, health, etc.
        # Example: GET /api/v1/users/me → Spring Boot
        location /api/ {
            proxy_pass http://nexus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket for Spring Boot (used for live updates — e.g. notifications).
        # Same WebSocket upgrade logic as the chat WebSocket above.
        location /ws/ {
            proxy_pass http://nexus_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;  # 24 hours — keep live connections alive
        }


        # ─── Spring Boot Actuator (HOME only) ─────────────────────────────────
        # /actuator/ exposes Spring Boot's health check and metrics endpoints.
        # Example: GET /actuator/health → {"status": "UP"}
        #
        # WHY RESTRICT IT? Actuator can expose sensitive info: memory usage,
        # env variables, bean names — things you don't want the public to see.
        # The $is_home check blocks anyone NOT on home WiFi or WireGuard VPN.
        location /actuator/ {
            if ($is_home = 0) {
                return 403;  # 403 Forbidden — you're not on the home network
            }
            proxy_pass http://nexus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        # ─── Grafana (HOME only) ───────────────────────────────────────────────
        # Grafana is the Console monitoring dashboard — CPU, RAM, container health.
        # Only accessible from home WiFi or WireGuard VPN.
        location /grafana/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Grafana also uses WebSockets for its live-updating charts.
        # Same upgrade pattern — must also be home-only.
        location /grafana/api/live/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }


        # ─── n8n Automation (HOME only, disabled by default) ──────────────────
        # n8n is a workflow automation tool. It's in a separate Docker profile
        # and won't even start unless you explicitly enable it (to save RAM).
        # Even if enabled, it's home-only for security.
        location /n8n/ {
            if ($is_home = 0) {
                return 403;
            }
            proxy_pass http://n8n;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ─── React Frontend (catch-all) ─────────────────────────────────────
        # If no other location block matched, Nginx serves the React app.
        # The React app is compiled into static files (HTML, JS, CSS) and
        # stored inside the Nginx container at /usr/share/nginx/html.
        #
        # HOW "try_files" WORKS:
        #   1. Try to serve the file exactly as requested: $uri
        #      e.g. /logo.png → serve the actual file
        #   2. Try to serve it as a directory: $uri/
        #      e.g. /about/ → look for /about/index.html
        #   3. Fall back to /index.html
        #      This is the magic that makes React Router work.
        #      React is a Single Page App — all routes (/dashboard, /family/chat)
        #      are handled by JavaScript, not by separate HTML files.
        #      Without this fallback, refreshing /dashboard would give a 404
        #      because there's no file literally named "dashboard" on disk.
        location / {
            root /usr/share/nginx/html;   # Where the React build output lives
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}